[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidequestor"
version = "0.1.3.dev0"
description = "Sidequestor workspace and triage command shell"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sidequestor = "sidequestor.cli:main"
sq = "sidequestor.cli:main"
yaas = "sidequestor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidequestor = ["*.json", "*.md", "*.html", "*.png", "package_data/*.md", "package_data/*.example", "package_data/skills/*/*", "runtime/**/*"]

[tool.setuptools.exclude-package-data]
sidequestor = ["**/__pycache__/*", "**/*.pyc"]
